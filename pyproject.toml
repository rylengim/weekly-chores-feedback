[project]
name = "weekly-chores-feedback"
version = "0.1.0"
description = "A shared household chores application built with Django."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1.1",
    "psycopg[binary]>=3.3.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
